<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>llm-worker</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1b1b19; --dim: #6c6c68; --line: #e2e2dd;
    --user: #ecebe6; --accent: #1b1b19;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --fg: #e8e6e1; --dim: #8d8b84; --line: #2c2a27;
      --user: #23211e; --accent: #e8e6e1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  header b { font-weight: 600; }
  header span { color: var(--dim); font-size: 12px; }
  header label { margin-left: auto; color: var(--dim); font-size: 12px; }
  header input {
    width: 68px; padding: 2px 4px; font: inherit; font-size: 12px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--line); border-radius: 3px;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .turn { max-width: 760px; margin: 0 auto 14px; }
  .who { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .body { white-space: pre-wrap; word-wrap: break-word; margin-top: 3px; }
  .user .body { background: var(--user); padding: 8px 10px; border-radius: 4px; }
  .note { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .cursor::after { content: "▍"; opacity: .5; }
  form {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--line); max-width: 792px; width: 100%;
    margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; height: 60px; padding: 8px;
    background: transparent; color: inherit; font: inherit;
    border: 1px solid var(--line); border-radius: 4px;
  }
  textarea:focus { outline: 1px solid var(--dim); }
  button {
    padding: 0 16px; font: inherit; cursor: pointer;
    border: 1px solid var(--accent); border-radius: 4px;
    background: var(--accent); color: var(--bg);
  }
  button.ghost { background: transparent; color: var(--fg); }
  button:disabled { opacity: .35; cursor: default; }
</style>

<header>
  <b>llm-worker</b>
  <span id="status">connecting…</span>
  <label id="cap">max tokens <input id="limit" type="number" value="2048" min="16" max="32768" step="16"></label>
</header>

<div id="log"></div>

<form id="form">
  <textarea id="input" placeholder="Ask something. Enter sends, shift-enter breaks a line." autofocus></textarea>
  <button id="send">Send</button>
  <button id="stop" class="ghost" type="button" disabled>Stop</button>
</form>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const stop = document.getElementById("stop");
  const status = document.getElementById("status");
  const limit = document.getElementById("limit");

  const messages = [];
  let model = "llm";
  let inflight = null;

  async function health() {
    try {
      const state = await (await fetch("/health")).json();
      model = state.model;
      status.textContent =
        `${state.model} · ${state.n_ctx} ctx · ${state.inflight}/${state.max_inflight} in flight`;
    } catch {
      status.textContent = "unreachable";
    }
  }

  function turn(role, text) {
    const el = document.createElement("div");
    el.className = `turn ${role}`;
    el.innerHTML = `<div class="who">${role}</div><div class="body"></div>`;
    el.querySelector(".body").textContent = text;
    log.append(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function note(el, text) {
    let n = el.querySelector(".note");
    if (!n) { n = document.createElement("div"); n.className = "note"; el.append(n); }
    n.textContent = text;
  }

  async function ask(prompt) {
    messages.push({ role: "user", content: prompt });
    turn("user", prompt);

    const answer = turn("assistant", "");
    const body = answer.querySelector(".body");
    body.classList.add("cursor");

    inflight = new AbortController();
    send.disabled = true;
    stop.disabled = false;

    const started = performance.now();
    let text = "";

    try {
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          model,
          messages,
          stream: true,
          max_tokens: Number(limit.value) || 2048,
          stream_options: { include_usage: true },
        }),
        signal: inflight.signal,
      });
      if (!response.ok) throw new Error(`ingress said ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      // Frames are separated by a blank line, and a read can end mid-frame,
      // so hold the tail until the next one completes it.
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, cut).trim();
          buffer = buffer.slice(cut + 2);
          if (!frame.startsWith("data: ")) continue;

          const data = frame.slice(6);
          if (data === "[DONE]") continue;

          const chunk = JSON.parse(data);
          if (chunk.error) throw new Error(chunk.error.message);

          const choice = chunk.choices?.[0] ?? {};
          if (choice.delta?.content) {
            text += choice.delta.content;
            body.textContent = text;
            log.scrollTop = log.scrollHeight;
          }
          if (choice.finish_reason) {
            const seconds = (performance.now() - started) / 1000;
            const used = chunk.usage;
            const why = choice.finish_reason === "length"
              ? "hit the token limit" : choice.finish_reason;
            note(answer, used
              ? `${why} · ${used.completion_tokens} tokens · ` +
                `${(used.completion_tokens / seconds).toFixed(1)} tok/s · ` +
                `${used.prompt_tokens} prompt`
              : why);
          }
        }
      }

      if (text) messages.push({ role: "assistant", content: text });
    } catch (error) {
      // Aborting drops the connection, and the ring closes the stream, which
      // is what cancels the generation on the worker. Nothing else to send.
      note(answer, error.name === "AbortError" ? "cancelled" : `failed: ${error.message}`);
    } finally {
      body.classList.remove("cursor");
      inflight = null;
      send.disabled = false;
      stop.disabled = true;
      input.focus();
      health();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const prompt = input.value.trim();
    if (!prompt || inflight) return;
    input.value = "";
    ask(prompt);
  });

  stop.addEventListener("click", () => inflight?.abort());

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  health();
</script>
