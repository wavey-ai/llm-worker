[package]
name = "llm-serve"
description = "An ingress and a worker in one process, over an in-process ring."
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "llm_serve"
path = "src/lib.rs"

[[bin]]
name = "llm-serve"
path = "src/main.rs"

[dependencies]
llm-engine = { path = "../../llm-engine" }
llm-worker = { path = "../../llm-worker" }

anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

async-trait = "0.1"
base64 = "0.22"
bytes = "1"
http = "1"

upload-response = { git = "https://github.com/wavey-ai/web-services.git", branch = "main", package = "av-upload-response" }
web-service = { git = "https://github.com/wavey-ai/web-services.git", branch = "main", package = "av-web-service" }

[dev-dependencies]
futures-util = "0.3"
